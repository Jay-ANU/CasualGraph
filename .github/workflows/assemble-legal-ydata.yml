name: Finalize legal YData regression wiring
on:
  push:
    branches: [feat/legal-ydata-max-models]
    paths: ['.github/workflows/assemble-legal-ydata.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'Jay-ANU/CasualGraph' && github.ref == 'refs/heads/feat/legal-ydata-max-models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Finalize and remove one-time branch wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def patch(path,old,new):
              p=Path(path); text=p.read_text()
              assert text.count(old)==1,(path,old[:80],text.count(old))
              p.write_text(text.replace(old,new))
          patch('tests/test_contract_review_product.py',
              'application.dependency_overrides[router_module.require_legal_max] = router_module.get_current_user',
              'application.dependency_overrides[router_module.require_legal_max] = lambda: actor  # Plan checks have a separate real-dependency suite.')
          patch('frontend/src/pages/MaxMemberships.tsx',
              "  useEffect(() => { void load().catch(e => setError(e instanceof Error ? e.message : '读取失败。')); }, [load]);",
              """  useEffect(() => {
              let cancelled = false;
              apiFetch<{ memberships: Membership[] }>('/admin/max-memberships')
                .then(data => { if (!cancelled) setRows(data.memberships); })
                .catch(e => { if (!cancelled) setError(e instanceof Error ? e.message : '读取失败。'); });
              return () => { cancelled = true; };
            }, []);""")
          patch('api/routers/max_memberships.py',
              "        cursor = await db.execute('DELETE FROM max_memberships WHERE user_id=? AND version=?', (user_id, version))",
              """        # Keep a versioned tombstone. Deleting/reinserting would reset the version
                  # and allow an old request to revoke a newly granted membership (ABA).
                  now = datetime.now(timezone.utc).isoformat()
                  cursor = await db.execute('''UPDATE max_memberships SET expires_at=?,updated_at=?,granted_by=?,version=version+1
                      WHERE user_id=? AND version=?''', (now, now, user['id'], user_id, version))""")
          with Path('tests/test_legal_ydata_max.py').open('a') as f:
              f.write('''
          def test_regrant_never_reuses_a_revoked_version(api):
              client,actor,path,_=api
              actor.update(id='admin',email='admin@example.test',role='admin')
              assert client.put('/admin/max-memberships',json={'email':'free@example.test'}).json()['version']==1
              assert client.delete('/admin/max-memberships/free?version=1').status_code==200
              assert client.put('/admin/max-memberships',json={'email':'free@example.test','expected_version':0}).status_code==409
              assert client.put('/admin/max-memberships',json={'email':'free@example.test','expected_version':2}).json()['version']==3
              assert client.delete('/admin/max-memberships/free?version=1').status_code==409
              access.assert_worker_max('free')
          ''')
          with Path('docs/legal-ydata-max.md').open('a') as f:
              f.write('\nRevocation retains an expired, versioned membership record; reactivation is an edit at the current version. This prevents stale revoke requests from affecting a new grant.\n')
          PY
          python -m compileall -q legal services api tests
          git rm .github/workflows/assemble-legal-ydata.yml scripts/_wire_legal_ydata.py
          git add api/routers/max_memberships.py frontend/src/pages/MaxMemberships.tsx tests/test_contract_review_product.py tests/test_legal_ydata_max.py docs/legal-ydata-max.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix regression harness, preserve grant versions and remove assembly workflow'
          git push origin HEAD:refs/heads/feat/legal-ydata-max-models
