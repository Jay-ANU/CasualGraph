name: Legal audit source snapshot
on:
  push:
    branches: ['fix/legal-audit-foundation-20260925']
    paths: ['.github/workflows/legal-audit-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip -o /tmp/legal-audit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: legal-audit-source
          path: /tmp/legal-audit-source.zip
          retention-days: 1
