name: DeepSeek migration checks
on:
  pull_request:
    paths:
      - 'configs/**'
      - 'rag/**'
      - 'frontend/**'
      - 'tests/test_deepseek_migration.py'
      - '.github/workflows/deepseek-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest python-dotenv 'openai>=1.0.0' 'anthropic>=0.40.0' httpx
      - run: python -m pytest tests/test_deepseek_migration.py -q
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
