name: Review and apply UI refinement
on:
  push:
    branches: [feat/fancy-frontend-polish]
    paths: ['.ui-refinement/**', '.github/workflows/apply-ui-refinement.yml']
permissions:
  contents: read
jobs:
  visual-review:
    if: github.repository == 'Jay-ANU/CasualGraph' && github.ref == 'refs/heads/feat/fancy-frontend-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fancy-frontend-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the unchanged reference version
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          CI=false npm run build
          cp -R build /tmp/reference-build
      - name: Materialize reviewed UI changes with source and output hash checks
        run: |
          python - <<'PY'
          import ast, base64, hashlib, json, lzma
          from pathlib import Path
          root = Path.cwd().resolve()
          encoded = ''.join((root / f'.ui-refinement/part{i}.b64').read_text().strip() for i in range(2))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'fac5e931c32ff8e8bbb54f97342506a6e2bdeace9b38b52c77f1469e4c6e8116'
          outputs = []
          for item in json.loads(raw):
              relative = item['path']
              assert relative.startswith('frontend/src/') or relative in {'scripts/research_visual_review.py', 'scripts/research_ui_smoke.py'}
              path = root / relative
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['old'], f'Baseline changed: {relative}'
              if item['new'] is None:
                  outputs.append((path, None))
                  continue
              lines = (old or b'').decode().splitlines(keepends=True)
              for start, end, text in reversed(item['edits']):
                  lines[start:end] = [text]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == item['new'], f'Output mismatch: {relative}'
              if path.suffix == '.py': ast.parse(data, filename=relative)
              outputs.append((path, data))
          for path, data in outputs:
              if data is None: path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          # Schedule source focus after the drawer records the invoking control.
          p = root / 'frontend/src/components/research/SourcePassages.tsx'
          text = p.read_text()
          old = "    if (target) { target.scrollIntoView({ block: 'nearest', behavior: 'auto' }); target.focus({ preventScroll: true }); }"
          new = "    if (!target) return;\n    const frame = window.requestAnimationFrame(() => {\n      target.scrollIntoView({ block: 'nearest', behavior: 'auto' });\n      target.focus({ preventScroll: true });\n    });\n    return () => window.cancelAnimationFrame(frame);"
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Test and build the refined version
        working-directory: frontend
        run: |
          CI=true npm test -- --watchAll=false --runInBand
          CI=true npm run build
      - name: Install browser test runtime
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Compare identical content and viewport against the reference
        run: python scripts/research_visual_review.py --baseline --build /tmp/reference-build --out ui-artifacts/before
      - name: Verify empty and populated research flows
        run: python scripts/research_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-review
          path: ui-artifacts
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-build
          path: frontend/build
          retention-days: 3
      - name: Commit only verified frontend and test changes
        run: |
          rm -rf .ui-refinement
          rm .github/workflows/apply-ui-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src scripts/research_visual_review.py scripts/research_ui_smoke.py .ui-refinement .github/workflows/apply-ui-refinement.yml
          git diff --cached --check
          git commit -m 'style: replace decorative UI with source-led research surfaces and verifiable citations'
          git push origin HEAD:refs/heads/feat/fancy-frontend-polish
