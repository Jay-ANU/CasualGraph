name: Integrate verified legal audit fixes
on:
  push:
    branches: ['fix/legal-audit-foundation-20260925']
    paths: ['.github/workflows/legal-audit-integrate.yml']
permissions:
  contents: write
concurrency:
  group: legal-audit-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/legal-audit-foundation-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply exact source edits
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path('.')
          encoded = ''.join((root / f'.audit-transfer/part{i}.txt').read_text().strip() for i in (1, 2, 3))
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '42999fa382c839837804c3a9616f6b9466c3bc45be840ed6c612cf74b54df8c9', 'source payload hash mismatch'
          patch = json.loads(data)
          assert patch['base'] == '1c1b702bb3720a2dae9a2e08d625c1ac935771ed'
          subprocess.run(['git', 'merge-base', '--is-ancestor', patch['base'], 'HEAD'], check=True)
          allowed = set('''.env.example api/routers/contract_review.py docs/legal-audit-foundation.md frontend/src/legal/AuditControls.tsx frontend/src/legal/LegalDesk.css frontend/src/legal/LegalDesk.tsx frontend/src/legal/findingStatus.test.ts frontend/src/legal/findingStatus.ts frontend/src/legal/parts.tsx frontend/src/legal/types.ts legal/contract_documents.py legal/data_boundary.py legal/draft_release.py legal/redaction_detection.py legal/review_quality.py legal/review_questions.py legal/review_store.py legal/review_v2.py scripts/legal_ui_smoke.py scripts/verify_legal_release.mjs scripts/verify_legal_release.test.mjs tests/test_contract_review_product.py tests/test_legal_audit_foundation.py tests/test_legal_ydata_max.py'''.split())
          assert len(patch['files']) == 24 and {f['path'] for f in patch['files']} == allowed
          prepared = []
          for item in patch['files']:
              path = root / item['path']
              assert not path.is_symlink()
              before = path.read_text(encoding='utf-8') if path.exists() else ''
              if item['before'] is None:
                  assert not path.exists(), f'unexpected existing file: {path}'
              else:
                  assert path.exists() and hashlib.sha256(before.encode()).hexdigest() == item['before'], f'base hash mismatch: {path}'
              after = before
              end = len(before)
              for edit in sorted(item['edits'], key=lambda e: e['start'], reverse=True):
                  assert 0 <= edit['start'] <= edit['end'] <= end
                  after = after[:edit['start']] + edit['text'] + after[edit['end']:]
                  end = edit['start']
              assert hashlib.sha256(after.encode()).hexdigest() == item['after'], f'result hash mismatch: {path}'
              prepared.append((path, after))
          for path, text in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'add', '-f', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', *[f'.audit-transfer/part{i}.txt' for i in (1, 2, 3)]], check=True)
          print('Verified and applied 24 exact file hashes. No production configuration or secrets accessed.')
          PY
      - name: Commit only the isolated feature branch
        shell: bash
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(legal): audit redaction and exact-draft release safety'
          git push origin HEAD:refs/heads/fix/legal-audit-foundation-20260925
