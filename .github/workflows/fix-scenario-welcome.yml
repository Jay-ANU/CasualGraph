name: Correct shared scenario welcome
on:
  push:
    branches: ['feat/legal-contract-scenarios-20260925']
    paths: ['.github/workflows/fix-scenario-welcome.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified selector correction and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p=Path('frontend/src/legal/LegalDesk.tsx'); old=p.read_text(); s=old
          assert hashlib.sha256(old.encode()).hexdigest()=='7c897b3340f1e947a335c666f0be01e10cfc9f3cb923e2ab60c357a2bc568918'
          s=s.replace("import { changeScenario, scenarioRoleValid }", "import { changeScenario, currentScenario, scenarioRoleValid }")
          s=s.replace("    const workspace = this.state.workspace;\n", "    const workspace = this.state.workspace;\n    const contractType = !this.state.contract && currentScenario(this.state.caps?.scenario_catalog, this.state.contractType) ? this.state.contractType : '采购合同';\n")
          s=s.replace("instructions: this.state.contract ? '' : this.state.instructions, contractType: '采购合同',", "instructions: this.state.contract ? '' : this.state.instructions, contractType,")
          a='{TYPES.slice(0, 3).map(t => <button key={t} className={s.contractType === t ? \'selected\' : \'\'} onClick={() => this.setState({ contractType: t })}><Icon name="file" />{t}</button>)}'
          b='{s.caps?.scenario_catalog?.scenarios.filter(scene => scene.group === \'常用合同\').map(scene => <button key={scene.id} className={s.contractType === scene.label ? \'selected\' : \'\'} onClick={() => this.setState(changeScenario(s.caps?.scenario_catalog, scene.label))}><Icon name="file" />{scene.label}</button>)}'
          assert a in s
          s=s.replace(a,b)
          assert hashlib.sha256(s.encode()).hexdigest()=='636e7d1d634cb5502102d80e20f74f5d3f9ed2a617a4f9a3e913633f80f779e5'
          q=Path('scripts/legal_ui_smoke.py'); before=q.read_text(); t=before
          assert hashlib.sha256(before.encode()).hexdigest()=='0d8fe61efdff99024317f83ac9b4c2b337808442aab3a916bf8f04d581f2f6ce'
          t=t.replace("        page.get_by_label('审查关注点').fill('重点关注付款安排')", "        page.get_by_role('button',name='销售合同',exact=True).click()\n        page.get_by_label('审查关注点').fill('重点关注付款安排')")
          t=t.replace("        for scene in SCENARIOS['scenarios']:", "        expect(page.get_by_label('合同类型',exact=True)).to_have_value('销售合同')\n        for scene in SCENARIOS['scenarios']:")
          assert hashlib.sha256(t.encode()).hexdigest()=='b3266a57c2e7af068decac1ad3e57e625198713d64f304512f74b255548053e8'
          p.write_text(s); q.write_text(t)
          subprocess.run(['git','add','--',str(p),str(q)],check=True)
          subprocess.run(['git','rm','--','.github/workflows/fix-scenario-welcome.yml'],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(legal): use shared welcome scenarios and preserve pre-upload choice'
          git push origin HEAD:refs/heads/feat/legal-contract-scenarios-20260925
