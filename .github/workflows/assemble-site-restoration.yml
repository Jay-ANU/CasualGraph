name: Assemble requested site restoration
on:
  push:
    branches: [fix/preserve-pages-word-revisions]
    paths: [scripts/_apply_site_restore.py]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Jay-ANU/CasualGraph' && github.ref == 'refs/heads/fix/preserve-pages-word-revisions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the reviewed compatibility patch on this repair branch
        run: |
          set -euo pipefail
          python scripts/_apply_site_restore.py
          python -m compileall -q legal api tests app.py
          git add frontend legal api tests app.py scripts/research_ui_smoke.py scripts/legal_ui_smoke.py
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Adapt restored surfaces to current API, lint and permission checks'
          git push origin HEAD:refs/heads/fix/preserve-pages-word-revisions
