name: Integrate hash-verified Legal collaboration
on:
  push:
    branches: [feat/legal-agent-collaboration]
    paths: [scripts/_apply_legal_collaboration.py]
permissions:
  contents: write
concurrency:
  group: legal-collaboration-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Jay-ANU/CasualGraph' && github.ref == 'refs/heads/feat/legal-agent-collaboration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the reviewed source changes and remove this one-time workflow
        run: |
          set -euo pipefail
          python scripts/_apply_legal_collaboration.py
          python -m compileall -q legal api
          git add api/routers/contract_review.py legal/review_store.py legal/review_engine.py
          git rm scripts/_apply_legal_collaboration.py scripts/_legal_router_methods.txt scripts/_legal_router_additions.txt scripts/_legal_store_additions.txt .github/workflows/integrate-legal-collaboration.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate versioned contract collaboration with existing Max and Word guards'
          git push origin HEAD:refs/heads/feat/legal-agent-collaboration
