name: CI
on:
  pull_request:
  push:
    branches: [main, 'claude/**', 'feat/legal-review-external-evidence']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: deepseek
      ESG_EMBEDDING_ALLOW_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff gate (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Check Python syntax
        run: python -m compileall -q $(git ls-files '*.py')
      - name: Backend tests (mocked providers, no API credit)
        run: python -m pytest -q tests
      - name: Public-query live law retrieval diagnostic (no contract or model credit)
        run: python scripts/legal_retrieval_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-retrieval-probe
          path: legal-retrieval-probe.json
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runtime
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Existing research and contract UI browser checks (mock APIs)
        working-directory: .
        run: |
          python scripts/research_ui_smoke.py
          python scripts/legal_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: ui-artifacts
          retention-days: 7
