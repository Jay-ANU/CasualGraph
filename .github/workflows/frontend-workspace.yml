name: Legal UI final verification
on:
  push:
    branches: [feat/legal-motion-bilingual]
    paths: [.github/workflows/frontend-workspace.yml, '.ui-finish/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact UI corrections
        run: python .ui-finish/apply.py
      - name: Build and unit verification
        working-directory: frontend
        run: |
          set -o pipefail
          mkdir -p ../ui-artifacts
          npm ci --no-audit --no-fund
          npm run typecheck 2>&1 | tee ../ui-artifacts/typecheck.log
          npm run lint 2>&1 | tee ../ui-artifacts/lint.log
          npm test -- --run 2>&1 | tee ../ui-artifacts/unit-tests.log
          npm run build 2>&1 | tee ../ui-artifacts/build.log
      - name: Install browser runtime
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/cg-browser" --no-audit --no-fund agent-browser@0.27.0
      - name: Browser visual inspection
        id: visual
        continue-on-error: true
        run: |
          set -o pipefail
          CHROME=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export AGENT_BROWSER_EXECUTABLE_PATH="$CHROME"
          AB="$RUNNER_TEMP/cg-browser/node_modules/.bin/agent-browser"
          python -m http.server 4190 --bind 127.0.0.1 --directory frontend/dist > ui-artifacts/preview-server.log 2>&1 &
          PID=$!
          trap '"$AB" close || true; kill "$PID" || true' EXIT
          "$AB" open http://127.0.0.1:4190
          "$AB" wait --load networkidle
          "$AB" snapshot -i | tee ui-artifacts/agent-browser-snapshot.txt
          "$AB" screenshot ui-artifacts/agent-browser-home.png
          "$AB" errors | tee ui-artifacts/agent-browser-errors.txt
      - name: Motion, locale, contrast and responsive checks
        id: motion
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/legal_motion_locale_smoke.py 2>&1 | tee ui-artifacts/motion-smoke.log
      - name: Legal workflow regression
        id: legal
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/legal_ui_smoke.py 2>&1 | tee ui-artifacts/legal-smoke.log
      - name: Research workflow regression
        id: research
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/research_ui_smoke.py 2>&1 | tee ui-artifacts/research-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-ui-final-verification
          path: ui-artifacts
          retention-days: 7
      - name: Require actual outcomes of all browser suites
        env:
          VISUAL: ${{ steps.visual.outcome }}
          MOTION: ${{ steps.motion.outcome }}
          LEGAL: ${{ steps.legal.outcome }}
          RESEARCH: ${{ steps.research.outcome }}
        run: test "$VISUAL" = success && test "$MOTION" = success && test "$LEGAL" = success && test "$RESEARCH" = success
      - name: Commit verified source changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .ui-finish
          git add frontend/src scripts/legal_motion_locale_smoke.py scripts/research_ui_smoke.py
          git commit -m 'fix: verify legal motion, readable bilingual UI and preserved research flows'
          git push origin HEAD:feat/legal-motion-bilingual
