name: Frontend inspection bundle
on:
  push:
    branches: [feat/legal-motion-bilingual]
    paths: [.github/workflows/frontend-workspace.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package committed source only
        run: git archive --format=tar.gz -o /tmp/cg-source.tar.gz HEAD
      - name: Prepare isolated visual inspection tool
        run: |
          npm install --prefix /tmp/cg-browser-tools --no-audit --no-fund agent-browser
          tar -czf /tmp/cg-browser-tools.tar.gz -C /tmp cg-browser-tools
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-inspection-bundle
          path: |
            /tmp/cg-source.tar.gz
            /tmp/cg-browser-tools.tar.gz
          retention-days: 1
