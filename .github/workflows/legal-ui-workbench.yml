name: Legal UI workbench
on:
  push:
    branches: ['claude/legal-ui-refactor']
    paths: ['.github/workflows/legal-ui-workbench.yml']
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2fc028277561b804f139a49a8386646d880a386
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser audit tools
        run: npm install --prefix /tmp/legal-tools --no-audit --no-fund agent-browser @axe-core/playwright
      - name: Package current public source and browser tools
        run: |
          mkdir -p /tmp/legal-ui-workbench
          git archive --format=tar HEAD | gzip > /tmp/legal-ui-workbench/source.tar.gz
          tar -czf /tmp/legal-ui-workbench/browser-tools.tar.gz -C /tmp legal-tools
      - uses: actions/upload-artifact@v4
        with:
          name: legal-ui-workbench
          path: /tmp/legal-ui-workbench/
          retention-days: 1
